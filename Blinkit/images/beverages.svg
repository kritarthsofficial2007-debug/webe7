<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <circle cx="100" cy="100" r="90" fill="#f3e8ff"/>
  <!-- Soda Can -->
  <g transform="translate(60, 60)">
    <rect x="0" y="10" width="36" height="70" rx="8" fill="#dc2626"/>
    <ellipse cx="18" cy="10" rx="18" ry="6" fill="#991b1b"/>
    <ellipse cx="18" cy="10" rx="14" ry="4" fill="#cbd5e1"/>
    <path d="M 5 40 Q 18 25 31 40" stroke="#ffffff" stroke-width="3" fill="none"/>
    <text x="6" y="58" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold">COLA</text>
  </g>
  <!-- Juice Glass with Straw -->
  <g transform="translate(105, 55)">
    <!-- Straw -->
    <line x1="28" y1="5" x2="16" y2="40" stroke="#f43f5e" stroke-width="5" stroke-linecap="round"/>
    <!-- Glass Body -->
    <polygon points="5,30 35,30 30,85 10,85" fill="#fb923c" opacity="0.9"/>
    <ellipse cx="20" cy="30" rx="15" ry="5" fill="#fdba74"/>
    <!-- Lemon slice on rim -->
    <circle cx="7" cy="27" r="10" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
  </g>
</svg>