    <polygon points="5,15 15,10 25,15 35,10 45,15 55,10 65,15 75,10 75,15" fill="#ca8a04"/>
    <polygon points="10,105 20,110 30,105 40,110 50,105 60,110 70,105 70,110" fill="#ca8a04"/>
    <!-- Center badge -->
