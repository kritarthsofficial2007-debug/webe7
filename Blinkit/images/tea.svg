<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <circle cx="100" cy="100" r="85" fill="#ecfdf5"/>
  <g transform="translate(60, 45)">
    <!-- Green Tea Box -->
    <rect x="5" y="10" width="70" height="60" rx="5" fill="#16a34a"/>
    <rect x="15" y="25" width="50" height="25" rx="3" fill="#ffffff"/>
    <text x="21" y="41" fill="#15803d" font-family="sans-serif" font-size="9" font-weight="bold">GREEN TEA</text>
    <!-- Steaming teacup -->
    <g transform="translate(10, 60)">
      <path d="M 10 20 L 50 20 C 48 35, 42 42, 30 42 C 18 42, 12 35, 10 20 Z" fill="#22c55e"/>
      <ellipse cx="30" cy="20" rx="20" ry="4" fill="#86efac"/>
      <!-- Steam -->
      <path d="M 25 12 Q 22 5 28 0" stroke="#86efac" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M 35 12 Q 32 5 38 0" stroke="#86efac" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
  </g>
</svg>